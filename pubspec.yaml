name: render_protocol_server
description: A server app using the shelf package and Docker.
version: 0.0.1
repository: https://github.com/renderprotocol/render_protocol_server
publish_to: none

environment:
  sdk: ^3.10.1

dependencies:
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  shelf_essentials: ^1.0.1

  uuid: ^4.5.2
  meta: ^1.17.0
  grpc: ^5.1.0
  logger: ^2.6.2
  mongo_dart: ^0.10.8
  
  rp_generated_dart:
    git:
      url: https://github.com/renderprotocol/rp_generated_dart.git
      ref: main
  rp_utils_dart:
    git:
      url: https://github.com/renderprotocol/rp_utils_dart.git
      ref: main

dev_dependencies:
  http: ^1.2.2
  lints: ^6.0.0
  test: ^1.25.6
